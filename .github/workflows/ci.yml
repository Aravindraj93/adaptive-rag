name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -I -m pytest tests -q
      - run: adaptive-rag-evaluate --repetitions 5
      - run: python -I examples/basic_search.py
      - run: python -m pip check
  evaluation-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev]" numpy onnxruntime tokenizers
      - run: python -I -m pytest benchmarks/test_phase10_protocol.py benchmarks/test_phase11_protocol.py benchmarks/test_routing_protocol.py -q
